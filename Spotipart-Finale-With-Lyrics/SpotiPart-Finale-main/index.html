<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotipart - Music Player</title>
    <link rel="stylesheet" href="SPOTIPART.css">
</head>

<body>
    <div class="app-layout">

        <!-- SIDEBAR -->
        <aside class="sidebar">
            <h1 class="logo">SpotiPart</h1>

            <nav class="nav-links">
                <button type="button" class="active" data-view="home">Home</button>
                <button type="button" data-view="library">Library</button>
            </nav>

            <div class="playlists">
                <button id="createPlaylistBtn">+ New Playlist</button>
                <ul id="playlistList">
                    <li><button type="button" data-playlist="favorites">Favorites</button></li>
                    <li><button type="button" data-playlist="chill-vibes">Chill Vibes</button></li>
                </ul>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content">
            <header class="top-bar">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search song or artist..."
                >
                <div class="top-right">
                <div class="user-badge">BSIT-1B</div>
                <img src="https://i.redd.it/rhqfiarq0xxh1.gif" alt="Looping gif" class="corner-gif">
                </div>
            </header>

            <!-- FEATURED PLAYLIST -->
            <section class="hero-banner">
                <div class="hero-art">
                    <img src="assets/playlist-banner.jpg" alt="Dog wrapped in a blanket holding a mug">
                </div>
                <div class="hero-text">
                    <span class="tag">FEATURED PLAYLIST</span>
                    <h2>SPOTIPAPART!</h2>
                    <p>Curated for coding, study, and relaxing. Papart's music hub!</p>
                    <button id="playAllBtn" class="primary-btn">▶ Play All</button>
                </div>
            </section>

            <!-- SYNCHRONIZED LYRICS -->
            <section class="lyrics-section">
                <div class="lyrics-header">
                    <span class="tag">NOW PLAYING</span>
                    <h2>Lyrics:</h2>
                </div>

                <div id="lyricsContainer" class="lyrics-container" aria-live="polite">
                    <p class="lyrics-placeholder">Play a song to see its lyrics...</p>
                </div>
            </section>

            <!-- SONG LIST -->
            <section class="tracks-section">
                <h2 id="tracksTitle" class="section-title">Your Songs</h2>

                <div class="tracks-header">
                    <span>#</span>
                    <span>Title &amp; Artist</span>
                    <span>Album</span>
                    <span>Duration</span>
                </div>

                <div id="tracksContainer" class="tracks-list">
                    <!-- JavaScript displays songs here -->
                </div>
            </section>
        </main>
    </div>

    <!-- BOTTOM MUSIC PLAYER -->
    <footer class="player-bar">
        <div class="now-playing">
            <div id="playerArt" class="player-art">🎵</div>
            <div class="song-info">
                <strong id="playerTitle">Select a track</strong>
                <p id="playerArtist">Spotipart Player</p>
            </div>
        </div>

        <div class="player-controls">
            <div class="control-btns">
                <button id="prevBtn" title="Previous">⏮</button>
                <button id="playBtn" class="play-circle" title="Play">▶</button>
                <button id="nextBtn" title="Next">⏭</button>
            </div>

            <div class="progress-wrap">
                <span id="currentTime">0:00</span>
                <input type="range" id="progressBar" value="0" min="0" max="100">
                <span id="totalDuration">0:00</span>
            </div>
        </div>

        <div class="volume-wrap">
            <span>🔊</span>
            <input type="range" id="volumeBar" value="80" min="0" max="100">
        </div>
    </footer>

    <script src="SPOTIPART.js"></script>
</body>
</html>
